# This copy is baked into the image (Dockerfile's COPY . .) as the fallback default -- in normal
# deployment via docker-compose.yml, frigate/profiles.yaml (repo root, alongside docker-compose.yml)
# is bind-mounted over this same path (/app/profiles.yaml) instead, so that's the one that actually
# takes effect; this copy only matters if that bind mount is ever removed. Keep the two in sync
# yourself if you edit one.
#
# Configures the internal AI stage -- ai_worker.py (ai_events_stage_enabled below), an alternative
# to n8n/metadata-processor.json, not a replacement for it: that workflow is left untouched in the
# repo (though it now expects the old vehicle_sightings/person_sightings shape this project moved
# away from -- see CLAUDE.md's "Universal sightings" section -- so it would need its own rework
# before being usable again). A second stage used to exist here (alert_ai_worker.py, analyzing a
# series of high-res crops gathered fresh per visit) but was removed entirely -- a visit's "alert"
# is now its video plus its own individually-analyzed connected events. See CLAUDE.md's "Alert AI
# stage" section for the full history.
#
# object_types is FLAT and universal -- one entry per Frigate object label (raw_events.objects),
# each with its own prompt/model. There is no "sighting_type" concept in the code at all: every
# analyzed sighting (car, truck, person, dog, whatever you add here) is stored the exact same way
# (see db.complete_sighting) -- the label itself is just data on the row (object_label), not a
# branch in the code. A Frigate label with no entry here is simply never claimed by this stage at
# all -- ai_status stays 'new' indefinitely, exactly as if this stage were off for that one type.
# Not a bug to fix -- there's nothing configured for it yet, add an entry whenever you want one
# analyzed.
#
# event_prompt -- ai_worker.py sends this with ONE single-frame crop (crop.crop_event's own
# record-stream region crop, downscaled to ai_image_max_dimension below). Answered as plain free
# text (no JSON) -- the whole response becomes sightings.description verbatim. This is deliberate:
# a fixed JSON schema is exactly the kind of per-type structure this redesign removed. If you want
# a detail captured (plate text, breed, collar color, whatever), ask for it directly in the
# prompt's own wording -- the model's own sentence is the record, not a set of columns.
#
# A bunch of settings, ALL OPTIONAL, live entirely in this file -- see profile_config.py. These are
# NOT env vars at all (deliberately -- they're settings you'd realistically want different per
# Frigate object type, so this file is the one place to configure them, not split across .env and
# here). Two tiers, checked in this order: a type's own object_types.<label> entry (below), then the
# `defaults` section right below this comment (a common value applied to every type that doesn't
# set its own -- for "change this everywhere except one or two exceptions"). If NEITHER sets a
# given key, ingest-worker falls back to a hardcoded default matching this project's original
# behavior (see config.py) -- so an empty/missing `defaults:` section and no per-type overrides is
# a perfectly valid, fully-working configuration, not a half-finished one.
#   telegram_events_mode / telegram_alerts_mode -- none/image/video/all (see telegram.py). e.g. a
#     `dog` entry could set telegram_events_mode: none to silence noisy dog-only notifications
#     while cars/people still notify normally. Hardcoded fallback: "none" (both).
#   ai_events_stage_enabled -- true/false, alternative to n8n/metadata-processor.json (see
#     CLAUDE.md's "Internal AI stage" section). Setting this true for at least one type (or in
#     `defaults`) is enough to start the stage's poll thread -- see
#     profile_config.any_ai_events_stage_enabled, used by main.py's thread-startup check.
#     Hardcoded fallback: false.
#   min_event_duration_seconds -- a tracked-object lifecycle shorter than this is filtered at
#     ingest time (mqtt_ingest.py), never even written to raw_events -- see
#     profiles.yaml.example's fuller comment for why (repeated tracker re-detections of one
#     stationary object flooding the queue). Hardcoded fallback: 0 (no filtering).
#   ai_image_max_dimension -- the long side (px) of the downscaled copy actually sent to the VLM
#     and stored in Postgres (raw_events.crop_image_base64) -- a downscale of Frigate's own
#     best-detection-score snapshot (crop.fetch_frigate_snapshot_base64, see CLAUDE.md's
#     "Cropping" section) -- crop.crop_event fetches that snapshot directly rather than seeking a
#     frame from the record-stream clip, so there's no region-crop/offset setting left to
#     configure per type. Per-type since a plate-heavy vehicle prompt may want more resolution
#     than a person/dog prompt. Hardcoded fallback: 1280.
#   store_video / store_video_visits / store_event_images -- true/false. Unlike the AI-stage flag
#     above, these apply to *any* Frigate label by default (not just ones with a profiles.yaml
#     prompt entry), so a type can get its own entry here purely to carry one of these keys, with
#     no chat_path/prompt at all. store_event_images persists Frigate's own snapshot (the same
#     bytes crop.crop_event already fetched) to disk under EVENT_IMAGES_STORAGE_PATH -- off by
#     default. e.g. a `person` entry could set store_video: false to skip storing clips for people
#     while cars still get them. store_video_visits was renamed from store_video_alerts ("alerts"
#     was a holdover name from the removed alert AI stage). Hardcoded fallback: false (all three).
#
# defaults: (optional) -- common values applied to every object type that doesn't set its own for
# that same key. Leave it out entirely (or omit individual keys) to fall straight through to the
# hardcoded fallback, exactly as if this section didn't exist.
# defaults:
#   store_video: false
object_types:
  car: &vehicle_profile
    chat_path: /REPLACE_WITH_VEHICLE_SLOT/v1/chat/completions
    # How long to wait for this type's chat completion, in seconds -- a local model on CPU/modest
    # GPU can genuinely take minutes. Falls back to AI_STAGE_DEFAULT_TIMEOUT_SECONDS if omitted.
    timeout_seconds: 180
    # Example overrides (commented out -- uncomment/edit to actually use). Left here as a
    # discoverable template rather than only described in prose above.
    # telegram_events_mode: image
    # telegram_alerts_mode: all
    # ai_events_stage_enabled: true
    # ai_image_max_dimension: 1280
    # store_video: true
    # store_video_visits: true
    # store_event_images: true
    event_prompt: >-
      This image shows a single moment from one vehicle sighting. In one or two short sentences,
      describe the vehicle's color, body type (sedan/suv/truck/van/pickup/minivan/etc.), make and
      model if you can identify them, any notable features (roof rack, ladder rack, trailer hitch,
      bike rack, tinted windows, decals or commercial branding, visible damage or rust, unusual
      color/wrap, aftermarket wheels), and the license plate text if it's visible and legible. If a
      detail isn't visible or you're not confident, simply omit it rather than guessing. Do not
      describe your process.
  truck: *vehicle_profile
  person:
    chat_path: /REPLACE_WITH_PERSON_SLOT/v1/chat/completions
    timeout_seconds: 180
    event_prompt: >-
      This image shows a single moment of one person. Describe their clothing colors and what
      they appear to be doing in this one frame, in one short sentence. No speculation about
      identity. Do not describe your process or repeat these instructions -- respond with only
      the one-sentence description.

# visit_summary -- a third, independent AI stage (visit_summary_worker.py), NOT per-object-type
# (a visit can span several types, so there's one shared prompt/provider, not one per label). Once
# every raw_event a visit grouped has settled its own ai_status, this sends all of those events'
# sightings.description text to an LLM for one synthesized account of the whole visit, stored in
# yard_stats.visit_summaries. Same provider/model/chat_path dispatch as object_types above. Off by
# default. See frigate/profiles.yaml.example for the full documented version of this block.
# visit_summary:
#   enabled: false
#   provider: llama_proxy
#   chat_path: /REPLACE_WITH_SUMMARY_SLOT/v1/chat/completions
#   timeout_seconds: 60
#   parallel_limit: 2
#   stale_minutes: 5
#   max_attempts: 3
#   poll_interval_seconds: 5
#   max_age_hours: null
#   prompt: >-
#     You are given a chronological list of short AI-generated descriptions, one per distinct
#     sighting during a single continuous visit to a property. Write one or two concise sentences
#     summarizing what happened during this visit as a whole. Do not describe your process.
